apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      # Init container to verify config and secrets are available
      initContainers:
      - name: wait-for-config
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          echo "Waiting for ConfigMap and Secret to be available..."
          until [ -f /config/DB_HOST ] && [ -f /secret/DB_PASSWORD ]; do
            echo "Waiting for configuration files..."
            sleep 2
          done
          echo "Configuration files found!"
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: secret-volume
          mountPath: /secret
      containers:
      - name: app
        image: myapp:1.0.0
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-db-config
        - secretRef:
            name: {{ .Release.Name }}-db-secret
        volumeMounts:
        - name: config-volume
          mountPath: /config
        - name: secret-volume
          mountPath: /secret
      volumes:
      - name: config-volume
        configMap:
          name: {{ .Release.Name }}-db-config
      - name: secret-volume
        secret:
          secretName: {{ .Release.Name }}-db-secret
