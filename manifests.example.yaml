# Chart.yaml
apiVersion: v2
name: my-application
description: A Helm chart that conditionally installs a database
version: 0.1.0
dependencies:
  - name: postgresql
    version: "12.5.6"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled

# values.yaml
postgresql:
  enabled: false  # Can be overridden to true to install the subchart
  # Default subchart values if installed
  auth:
    postgresPassword: ""
    database: myapp

# When postgresql.enabled is false, these values are used instead
externalDatabase:
  host: ""
  port: 5432
  database: myapp
  user: postgres
  password: ""

# templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-db-config
data:
  DB_HOST: {{ if .Values.postgresql.enabled }}{{ .Release.Name }}-postgresql{{ else }}{{ required "externalDatabase.host is required when postgresql.enabled is false" .Values.externalDatabase.host }}{{ end }}
  DB_PORT: {{ if .Values.postgresql.enabled }}"5432"{{ else }}{{ .Values.externalDatabase.port | quote }}{{ end }}
  DB_NAME: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.database }}{{ else }}{{ .Values.externalDatabase.database }}{{ end }}
  DB_USER: {{ if .Values.postgresql.enabled }}"postgres"{{ else }}{{ .Values.externalDatabase.user }}{{ end }}

# templates/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db-secret
type: Opaque
data:
  DB_PASSWORD: {{ if .Values.postgresql.enabled }}{{ .Values.postgresql.auth.postgresPassword | b64enc }}{{ else }}{{ .Values.externalDatabase.password | b64enc }}{{ end }}

# templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-app
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-app
    spec:
      containers:
      - name: app
        image: myapp:1.0.0
        envFrom:
        - configMapRef:
            name: {{ .Release.Name }}-db-config
        - secretRef:
            name: {{ .Release.Name }}-db-secret
